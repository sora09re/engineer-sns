# ワークフローのアクションを更新する。.github/workflows/actions.lock も同じ PR で更新される。npm のパッケージは対象にしない
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # 出たばかりの版は避ける
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
